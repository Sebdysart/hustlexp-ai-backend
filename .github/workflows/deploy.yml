name: Production release hold evidence

# Production deployment is deliberately unavailable from this repository.
# This manual workflow proves only that the selected commit is attributable,
# compiles, and keeps new customer-money creation frozen. A future deployment
# workflow requires a separately approved exact release manifest, staging
# acceptance, environment approval, and live Railway autodeploy readback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustlexp-engine-production-hold
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  HX_PAYMENT_CREATION_MODE: frozen

jobs:
  verify-held-revision:
    name: Verify exact held revision; no deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - name: Compile an attributable held artifact
        run: npm run compile
        env:
          HX_BUILD_ENVIRONMENT: production
      - name: Verify exact build and production money freeze
        run: |
          node --input-type=module <<'NODE'
          import { isTrustedBuildIdentity, readBuildIdentity } from './dist/backend/src/buildIdentity.js';
          import { newPaymentCreationMode } from './dist/backend/src/services/NewPaymentCreationGuard.js';
          const identity = readBuildIdentity();
          if (identity.revision !== process.env.GITHUB_SHA) throw new Error('revision mismatch');
          if (identity.source !== 'GITHUB_SHA') throw new Error('revision did not come from GitHub runner provenance');
          if (!isTrustedBuildIdentity(identity)) throw new Error('compiled artifact measurement is not trusted');
          if (identity.service !== 'hustlexp-engine') throw new Error('service mismatch');
          if (newPaymentCreationMode(process.env) !== 'frozen') throw new Error('money creation is not frozen');
          NODE
      - name: Record the deliberate production hold
        run: >-
          echo "Production deployment remains held for ${GITHUB_SHA};
          this workflow has no Railway credential, command, or deployment job."
