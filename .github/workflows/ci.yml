name: CI — Lint, Typecheck, Test

on:
  push:
    branches: [main, "feat/*", codex/adult-hustler-gate]
  pull_request:
    branches: [main, "feat/*", codex/adult-hustler-gate]
  workflow_call:
    outputs:
      typecheck_result:
        description: "TypeCheck job result"
        value: ${{ jobs.typecheck.result }}
      lint_result:
        description: "Lint job result"
        value: ${{ jobs.lint.result }}
      test_result:
        description: "Test job result"
        value: ${{ jobs.test.result }}
      build_result:
        description: "Build job result"
        value: ${{ jobs.build.result }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  typecheck:
    name: TypeScript — zero errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "TypeScript — zero errors (backend/src/)"
        run: npx tsc --noEmit

  lint:
    name: "Lint — zero warnings (backend/src/)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "Lint — zero warnings (backend/src/)"
        run: npx eslint backend/src/ --ext .ts --max-warnings 0

  test:
    name: "Tests — zero failures"
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.TEST_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.TEST_UPSTASH_REDIS_REST_TOKEN }}
      FIREBASE_PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "Tests — zero failures"
        run: npx vitest run --reporter=verbose
        timeout-minutes: 10
      - name: Production role readiness contract
        run: npm run verify:production-role-readiness:contract
      - name: Production legal approval contract
        run: npm run verify:production-legal-approval:contract

  audit:
    name: "Security audit — no high/critical production vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "Security audit — production dependencies"
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Validate build compiles cleanly
        run: npm run compile
      - name: Build production container
        env:
          IMAGE_TAG: hustlexp-backend-ci:${{ github.sha }}
        run: |
          docker build \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --tag "${IMAGE_TAG}" \
            .
      - name: Verify production image migration packaging
        env:
          IMAGE_TAG: hustlexp-backend-ci:${{ github.sha }}
        run: |
          expected_count="$(find backend/database/migrations -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual_count="$(docker run --rm --entrypoint node "${IMAGE_TAG}" -e "const fs=require('fs'); console.log(fs.readdirSync('/app/backend/database/migrations').filter((name)=>name.endsWith('.sql')).length)")"
          test "$actual_count" = "$expected_count"
