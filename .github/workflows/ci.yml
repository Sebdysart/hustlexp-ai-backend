name: CI — Lint, Typecheck, Test

on:
  push:
    branches: [main, "feat/*", codex/adult-hustler-gate]
  pull_request:
    branches: [main, "feat/*", codex/adult-hustler-gate]
  workflow_call:
    outputs:
      typecheck_result:
        description: "TypeCheck job result"
        value: ${{ jobs.typecheck.result }}
      lint_result:
        description: "Lint job result"
        value: ${{ jobs.lint.result }}
      test_result:
        description: "Test job result"
        value: ${{ jobs.test.result }}
      build_result:
        description: "Build job result"
        value: ${{ jobs.build.result }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  typecheck:
    name: TypeScript — zero errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "TypeScript — zero errors (backend/src/)"
        run: npx tsc --noEmit

  lint:
    name: "Lint — zero warnings (backend/src/)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "Lint — zero warnings (backend/src/)"
        run: npx eslint backend/src/ --ext .ts --max-warnings 0

  test:
    name: "Tests — zero failures"
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hx_ci_runner
          POSTGRES_PASSWORD: hx_ci_password
          POSTGRES_DB: hx_ci_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hx_ci_runner -d hx_ci_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: test-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Compile exact test runtime
        run: npm run compile
      - name: Test database and outcome verifier contracts
        run: >-
          node --test
          scripts/prepare-test-databases.test.mjs
          scripts/run-required-tests.test.mjs
          scripts/verify-consequential-admin-mutations.test.mjs
          scripts/verify-engine-migrations-postgres.test.mjs
          scripts/verify-required-ci.test.mjs
          scripts/verify-team-alignment.test.mjs
          scripts/verify-vitest-outcome.test.mjs
      - name: Prepare isolated invariant and system PostgreSQL databases
        env:
          DATABASE_URL: postgresql://hx_ci_runner:hx_ci_password@127.0.0.1:5432/hx_ci_admin_test
          HX_ALLOW_CI_DB_RECREATE: 'true'
          TASK_LOCATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TASK_LOCATION_ENCRYPTION_KEY_ID: hx-ci-location-v1
        run: node scripts/prepare-test-databases.mjs
      - name: "Tests — zero failures and zero skipped/todo"
        env:
          DATABASE_URL: postgresql://hx_ci_runner:hx_ci_password@127.0.0.1:5432/hx_ci_invariant_test
          LOCAL_TEST_DB_URL: postgresql://hx_ci_runner:hx_ci_password@127.0.0.1:5432/hx_ci_system_test
          REDIS_URL: redis://127.0.0.1:16379
          HX_ALLOW_E2E_LIFECYCLE: '1'
          HX_ALLOW_E2E_LIQUIDITY_EXPANSION: '1'
          HX_ALLOW_NOTIFICATION_PG: '1'
          HX_ALLOW_LEAD_INGRESS_PG: '1'
          HX_ALLOW_TASK_DRAFT_INGRESS_PG: '1'
          HX_ALLOW_WORKER_COUNTER_E2E: '1'
          ENGINE_API_MODE: test
          STRIPE_MODE: test
          HXOS_ALLOW_LOCAL_TEST_IDENTITY: 'true'
          HXOS_LOCAL_TEST_IDENTITY_SECRET: hx-ci-identity-deterministic-only-00000001
          HXOS_ALLOW_LOCAL_TEST_SCREENING: 'true'
          HXOS_LOCAL_TEST_SCREENING_SECRET: hx-ci-screening-deterministic-only-0000001
          HXOS_ALLOW_LOCAL_TEST_PAYOUT: 'true'
          HXOS_LOCAL_TEST_PAYOUT_SECRET: hx-ci-payout-deterministic-only-000000001
          HXOS_ALLOW_LOCAL_TEST_DURATION_EVIDENCE: 'true'
          HXOS_LOCAL_TEST_DURATION_EVIDENCE_SECRET: hx-ci-duration-evidence-only-000000000001
          HXOS_ALLOW_LOCAL_TEST_PROVIDER_CAPABILITY: 'true'
          HXOS_LOCAL_TEST_PROVIDER_CAPABILITY_SECRET: hx-ci-provider-capability-only-0000000001
          HXOS_ALLOW_LOCAL_TEST_LIQUIDITY: 'true'
          HXOS_LOCAL_TEST_LIQUIDITY_SECRET: hx-ci-liquidity-deterministic-only-0000001
          HXOS_ALLOW_LOCAL_TEST_OFFER_REVIEW: 'true'
          HXOS_LOCAL_TEST_OFFER_REVIEW_SECRET: hx-ci-offer-review-deterministic-only-00001
          TASK_LOCATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TASK_LOCATION_ENCRYPTION_KEY_ID: hx-ci-location-v1
        run: |
          mkdir -p reports
          npx vitest run --reporter=json --outputFile=reports/vitest.json
          node scripts/verify-vitest-outcome.mjs reports/vitest.json
        timeout-minutes: 10
      - name: Preserve exact Vitest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ github.sha }}
          path: reports/vitest.json
          if-no-files-found: error
          retention-days: 30
      - name: Production role readiness contract
        run: npm run verify:production-role-readiness:contract
      - name: Production legal approval contract
        run: npm run verify:production-legal-approval:contract

  audit:
    name: "Security audit — no high/critical production vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: "Security audit — production dependencies"
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hx_ci_runner
          POSTGRES_PASSWORD: hx_ci_password
          POSTGRES_DB: hx_ci_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hx_ci_runner -d hx_ci_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Validate build compiles cleanly
        run: npm run compile
      - name: Execute fresh, upgrade, replay, and recovery migrations on PostgreSQL
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://hx_ci_runner:hx_ci_password@127.0.0.1:5432/hx_ci_admin_test
          HX_ALLOW_CI_DB_RECREATE: 'true'
          TASK_LOCATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TASK_LOCATION_ENCRYPTION_KEY_ID: hx-ci-location-v1
        run: node scripts/verify-engine-migrations-postgres.mjs
      - name: Build production container
        env:
          IMAGE_TAG: hustlexp-backend-ci:${{ github.sha }}
        run: |
          docker build \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --tag "${IMAGE_TAG}" \
            .
      - name: Verify exact production image migration artifact
        env:
          IMAGE_TAG: hustlexp-backend-ci:${{ github.sha }}
        run: |
          expected_digest="$(tr -d '[:space:]' < backend/database/engine-migration-artifact.sha256)"
          source_digest="$(node dist/backend/src/jobs/engine-migration-manifest.js)"
          image_digest="$(docker run --rm --entrypoint node "${IMAGE_TAG}" dist/backend/src/jobs/engine-migration-manifest.js)"
          test "$source_digest" = "$expected_digest"
          test "$image_digest" = "$expected_digest"
