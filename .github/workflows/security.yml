name: Security
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HX_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# CodeQL and dependency review are enforcing on this public repository. Snyk
# remains disabled until its token is explicitly provisioned.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.HX_CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate excludes bundled local tooling
        env:
          HX_EXACT_CANDIDATE_SHA: ${{ env.HX_CANDIDATE_SHA }}
        run: node scripts/verify-local-tools-absence.mjs
      - run: npm ci
      - run: npm run verify:security-workflow:contract
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.HX_CANDIDATE_SHA }}
      - name: Verify exact candidate excludes bundled local tooling
        env:
          HX_EXACT_CANDIDATE_SHA: ${{ env.HX_CANDIDATE_SHA }}
        run: node scripts/verify-local-tools-absence.mjs
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.HX_CANDIDATE_SHA }}
      - name: Verify exact candidate excludes bundled local tooling
        env:
          HX_EXACT_CANDIDATE_SHA: ${{ env.HX_CANDIDATE_SHA }}
        run: node scripts/verify-local-tools-absence.mjs
      - uses: actions/dependency-review-action@v4

  snyk:
    if: ${{ vars.ENABLE_SNYK == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.HX_CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate excludes bundled local tooling
        env:
          HX_EXACT_CANDIDATE_SHA: ${{ env.HX_CANDIDATE_SHA }}
        run: node scripts/verify-local-tools-absence.mjs
      - run: npm ci
      - name: Snyk scan
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
