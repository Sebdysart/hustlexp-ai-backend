name: Security
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]

# ---------------------------------------------------------------------------
# ENFORCING security gate = the production-dependency `npm audit` check in
# ci.yml. It runs on every PR and fails on high or critical advisories.
#
# CodeQL and dependency-review require GitHub Advanced Security. Snyk requires
# an explicitly provisioned token. Capability-dependent jobs stay skipped until
# their repository variable is enabled; once enabled, failures are enforcing.
#
# ENABLE_GITHUB_ADVANCED_SECURITY=true requires GitHub Advanced Security and
# enables both codeql and dependency-review. ENABLE_SNYK=true requires the
# SNYK_TOKEN secret. Never enable either variable before its dependency exists.
# ---------------------------------------------------------------------------

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    if: ${{ vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  snyk:
    if: ${{ vars.ENABLE_SNYK == 'true' }}
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Snyk scan
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
