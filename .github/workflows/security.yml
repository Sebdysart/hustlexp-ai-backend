name: Security
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]

permissions:
  contents: read

# CodeQL and dependency review are enforcing on this public repository. Snyk
# remains disabled until its token is explicitly provisioned.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify:security-workflow:contract
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  snyk:
    if: ${{ vars.ENABLE_SNYK == 'true' }}
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Snyk scan
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
