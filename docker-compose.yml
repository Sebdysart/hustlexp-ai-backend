version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - HX_PAYMENT_CREATION_MODE=${HX_PAYMENT_CREATION_MODE:-frozen}
      - QUOTE_PAYMENT_PROVIDER=${QUOTE_PAYMENT_PROVIDER:-local_test}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-local_test}
      - TILLED_ENV=${TILLED_ENV:-sandbox}
      - TILLED_SECRET_KEY=${TILLED_SECRET_KEY}
      - TILLED_PUBLISHABLE_KEY=${TILLED_PUBLISHABLE_KEY}
      - TILLED_WEBHOOK_SECRET=${TILLED_WEBHOOK_SECRET}
      - TILLED_PLATFORM_ACCOUNT_ID=${TILLED_PLATFORM_ACCOUNT_ID}
      - TILLED_DEFAULT_PRICING_TEMPLATE_ID=${TILLED_DEFAULT_PRICING_TEMPLATE_ID}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/backend/src/jobs/workers.js
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - HX_PAYMENT_CREATION_MODE=${HX_PAYMENT_CREATION_MODE:-frozen}
      - QUOTE_PAYMENT_PROVIDER=${QUOTE_PAYMENT_PROVIDER:-local_test}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-local_test}
      - TILLED_ENV=${TILLED_ENV:-sandbox}
      - TILLED_SECRET_KEY=${TILLED_SECRET_KEY}
      - TILLED_PUBLISHABLE_KEY=${TILLED_PUBLISHABLE_KEY}
      - TILLED_WEBHOOK_SECRET=${TILLED_WEBHOOK_SECRET}
      - TILLED_PLATFORM_ACCOUNT_ID=${TILLED_PLATFORM_ACCOUNT_ID}
      - TILLED_DEFAULT_PRICING_TEMPLATE_ID=${TILLED_DEFAULT_PRICING_TEMPLATE_ID}
    restart: unless-stopped
    depends_on:
      - app
