# This repository does not own a runnable Docker Compose application stack.
# Use the sibling HustleXP-LLC/hustlexp-platform repository for the complete,
# synthetic, payment-frozen local environment. Keeping this file as a guarded
# pointer prevents `docker compose up` here from being mistaken for production,
# staging, or complete local orchestration.
name: hustlexp-backend-compose-pointer

services:
  use-canonical-platform-stack:
    image: busybox:1.36.1
    pull_policy: never
    profiles:
      - backend-compose-pointer
    command:
      - sh
      - -c
      - >-
        echo 'Backend-only Compose is intentionally disabled. Use the sibling
        hustlexp-platform repository for the complete synthetic local stack.' >&2;
        exit 64
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
